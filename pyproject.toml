[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcf-parser"
version = "0.1.0"
description = "Extract comment threads from Office documents"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "python-docx>=1.2,<2", "Pillow>=10"]

[project.scripts]
pcf-parser = "pcf_parser.cli:main"

[tool.setuptools.packages.find]
include = ["pcf_parser*"]
